
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>X1</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0b0d12;color:#e8eaf0;height:100dvh;display:flex;flex-direction:column;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #1c2130}
header b{font-size:19px;letter-spacing:.5px;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
#st{font-size:10.5px;color:#22d3ee;border:1px solid #1d4b55;background:#0d2b31;border-radius:20px;padding:3px 10px}
.hd-r{margin-left:auto;display:flex;gap:8px}
.hd-r button{background:#141926;border:1px solid #232a3a;color:#9aa3b8;border-radius:9px;width:36px;height:36px;font-size:17px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.row{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:#182032;border:1px solid #243052;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:#131824;border:1px solid #1e2433;color:#cfd5e2;border-bottom-left-radius:4px}
.nm{font-size:10px;color:#6b7385;margin-bottom:5px;letter-spacing:.3px}
#bar{display:flex;gap:9px;padding:11px 12px;border-top:1px solid #1c2130;background:#0b0d12}
#inp{flex:1;background:#0e1117;border:1px solid #232a3a;border-radius:12px;padding:12px;color:#e8eaf0;font-size:15px;outline:none;resize:none;max-height:130px;font-family:inherit;line-height:1.4}
#inp:focus{border-color:#2b4a55}
#snd{width:46px;border:none;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#080a0f;font-size:19px;cursor:pointer}
#snd:disabled{opacity:.5;cursor:wait}
#set{position:fixed;inset:0;background:#0b0d12;padding:22px 18px;display:none;flex-direction:column;gap:13px;z-index:9;overflow-y:auto}
#set.on{display:flex}
#set h3{font-size:17px;font-weight:600}
#set button{padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#080a0f;font-weight:600;font-size:14.5px;cursor:pointer}
#set small{color:#6b7385;font-size:12px;line-height:1.6}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6b7385;margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>

<header>
  <b>X1</b>
  <span id="st">unrestricted</span>
  <div class="hd-r">
    <button id="new" title="new chat">&#43;</button>
    <button id="gear" title="settings">&#9881;</button>
  </div>
</header>

<div id="msgs">
  <div class="row a"><div class="nm">x1</div>Bolo. Kuch bhi pucho — illegal, edgy, NSFW, coding, philosophy. Seedha jwab milega, sugarcoat nahi.</div>
</div>

<div id="bar">
  <textarea id="inp" rows="1" placeholder="Kuch bhi pucho..."></textarea>
  <button id="snd">&#10148;</button>
</div>

<div id="set">
  <h3>X1 settings</h3>
  <small>API key securely X1 backend par stored hai. Browser mein API key rakhne ki zaroorat nahi hai.</small>
  <button id="closeSettings">save &amp; close</button>
</div>

<script>
'use strict';

const API_URL = 'https://x1-ai-backend.onrender.com/api/chat';

const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const snd = document.getElementById('snd');
const settings = document.getElementById('set');

let hist = [];
let busy = false;
let used = '';

function save() {
  settings.classList.remove('on');
}

document.getElementById('gear').onclick = () => {
  settings.classList.add('on');
};

document.getElementById('closeSettings').onclick = save;

document.getElementById('new').onclick = () => {
  if (busy) return;
  hist = [];
  msgs.innerHTML =
    '<div class="row a"><div class="nm">x1</div>Naya chat. Bolo kya puchna hai.</div>';
};

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function add(type, text, name) {
  const d = document.createElement('div');
  d.className = 'row ' + type;

  if (name) {
    const label = document.createElement('div');
    label.className = 'nm';
    label.textContent = name;
    d.appendChild(label);
  }

  const content = document.createElement('div');
  content.innerHTML = text;
  d.appendChild(content);

  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 130) + 'px';
});

async function ask() {
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      messages: hist
    })
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error('Server ka response samajh nahi aaya.');
  }

  if (!response.ok) {
    throw new Error(
      data.error || 'Server error: ' + response.status
    );
  }

  if (typeof data.reply !== 'string') {
    throw new Error('AI ka reply nahi mila.');
  }

  used = data.model || 'X1';
  return data.reply;
}

async function send() {
  const text = inp.value.trim();

  if (!text || busy) return;

  inp.value = '';
  inp.style.height = 'auto';

  add('u', escapeHTML(text));
  hist.push({
    role: 'user',
    content: text
  });

  const typing = document.createElement('div');
  typing.className = 'row a';

  const label = document.createElement('div');
  label.className = 'nm';
  label.textContent = 'x1';

  const animation = document.createElement('span');
  animation.className = 'typing';
  animation.innerHTML = '<span></span><span></span><span></span>';

  typing.appendChild(label);
  typing.appendChild(animation);
  msgs.appendChild(typing);

  busy = true;
  snd.disabled = true;

  try {
    const reply = await ask();

    typing.replaceChildren();

    const name = document.createElement('div');
    name.className = 'nm';
    name.textContent = 'x1 · ' + used;

    const content = document.createElement('div');
    content.textContent = reply;

    typing.appendChild(name);
    typing.appendChild(content);

    hist.push({
      role: 'assistant',
      content: reply
    });
  } catch (error) {
    typing.replaceChildren();

    const name = document.createElement('div');
    name.className = 'nm';
    name.textContent = 'x1';

    const content = document.createElement('div');
    content.textContent = 'Error: ' + (
      error.message || 'Request failed'
    );

    typing.appendChild(name);
    typing.appendChild(content);
  } finally {
    busy = false;
    snd.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
    inp.focus();
  }
}

snd.addEventListener('click', send);

inp.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});
</script>
</body>
</html>
